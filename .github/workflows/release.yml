# Build the Linux AppImage, the Flatpak bundle and the Windows installer on
# every push, and attach all three to a GitHub release when a v* tag is pushed.
# Flathub itself builds from the flathub/io.github.PressF4me.Tawny repo.
#
# Builds go straight onto the release, never through workflow artifacts: the
# bundles are hundreds of MB each, and a private repo's artifact storage quota
# filled up and failed every build at the upload step.

# Every action is pinned to a commit, not a tag: a tag can be moved to different
# code by whoever controls (or has stolen) the action's repo, and these jobs hold
# a token that can replace release files. To update one, resolve the new tag to
# its commit (`gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`) and keep
# the tag in the trailing comment.

name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Write, for the attach steps on a tag. Pull requests from forks still get a
# read-only token.
permissions:
  contents: write

jobs:
  # On a tag, create the release first so the three builds can attach to it as
  # they finish, without racing each other to create it.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true

  appimage:
    needs: release
    # Runs when the release job was skipped too, i.e. on every non-tag build.
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    # GTK 4.14 is the oldest the pinned gtk4-rs features accept; 24.04 has it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libxkbcommon-dev cmake ninja-build file patchelf

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: CEF cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/tauri-cef
          key: cef-${{ hashFiles('src-tauri/Cargo.lock') }}

      # Compiling the CLI takes ~10 minutes; keep it outside ~/.cargo so
      # rust-cache's cleanup leaves it alone.
      - name: Tauri CLI cache
        id: tauri-cli
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.tauri-cli
          key: tauri-cli-3.0.0-alpha.6-${{ runner.os }}

      - name: Tauri CLI
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        # PowerShell, so these two steps read the same as the Windows job's.
        shell: pwsh
        run: cargo install tauri-cli --version '=3.0.0-alpha.6' --locked --root "$HOME/.tauri-cli"

      - name: Tauri CLI on PATH
        shell: pwsh
        run: Join-Path $HOME .tauri-cli bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build
        run: tools/build-appimage.sh

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*.AppImage

  flatpak:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      # The runner's preinstalled SDKs are mounted in only so the first step
      # can delete them: a CEF build needs more disk than the runner has free.
      options: >-
        --privileged
        -v /usr/share/dotnet:/hostfree/dotnet
        -v /usr/local/lib/android:/hostfree/android
        -v /opt/hostedtoolcache:/hostfree/toolcache
        -v /usr/local/.ghcup:/hostfree/ghcup
    steps:
      - name: Free runner disk
        run: |
          rm -rf /hostfree/*/* || true
          df -h /

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40 # master, 2025-04-24
        with:
          manifest-path: packaging/flatpak/io.github.PressF4me.Tawny.yml
          bundle: Tawny-x86_64.flatpak
          cache-key: flatpak-${{ hashFiles('src-tauri/Cargo.lock') }}
          upload-artifact: false

      - name: Name the Flatpak bundle after the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: mv Tawny-x86_64.flatpak "Tawny-${GITHUB_REF_NAME#v}-x86_64.flatpak"

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: Tawny-*-x86_64.flatpak

  windows:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      # cef-dll-sys builds CEF's C++ wrapper with CMake's Ninja generator, which
      # needs Ninja and the MSVC compiler on PATH.
      - uses: seanmiddleditch/gha-setup-ninja@96bed6edff20d1dd61ecff9b75cc519d516e6401 # v5
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: CEF cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/AppData/Local/tauri-cef
          key: cef-windows-${{ hashFiles('src-tauri/Cargo.lock') }}

      # Compiling the CLI takes ~10 minutes; keep it outside ~/.cargo so
      # rust-cache's cleanup leaves it alone.
      - name: Tauri CLI cache
        id: tauri-cli
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.tauri-cli
          key: tauri-cli-3.0.0-alpha.6-${{ runner.os }}

      - name: Tauri CLI
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        # PowerShell, not bash: on Windows, Git Bash puts its coreutils `link`
        # ahead of MSVC's link.exe and every Rust link fails.
        shell: pwsh
        run: cargo install tauri-cli --version '=3.0.0-alpha.6' --locked --root "$HOME/.tauri-cli"

      - name: Tauri CLI on PATH
        shell: pwsh
        run: Join-Path $HOME .tauri-cli bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build
        working-directory: src-tauri
        run: cargo tauri build --bundles nsis

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
